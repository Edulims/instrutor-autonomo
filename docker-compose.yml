# Docker Compose for Instrutores Autônomos de Trânsito
#
#   Production build served by nginx:
#     docker compose up --build            ->  http://localhost:8080
#
#   Live dev server with hot reload (Vite):
#     docker compose --profile dev up      ->  http://localhost:5173

services:
  web:
    build:
      context: .
      target: runtime
    image: instrutores-autonomos-transito:latest
    container_name: instrutores-web
    ports:
      - "8080:80"
    restart: unless-stopped

  # Optional development service — only starts with `--profile dev`.
  dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: instrutores-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
